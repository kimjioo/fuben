services:
  gateway:
    image: nginx:1.27-alpine
    container_name: fuben-gateway
    restart: unless-stopped
    depends_on:
      fuben:
        condition: service_healthy
      backup-api:
        condition: service_healthy
    ports:
      - "${FUBEN_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true

  fuben:
    image: fuben-record-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuben-record-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backup-api:
    image: fuben-backup-api:latest
    build:
      context: ./backup-api
      dockerfile: Dockerfile
    container_name: fuben-backup-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_PATH: /data/fuben.sqlite3
      PORT: 8080
    volumes:
      - fuben_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  fuben_data:
    name: fuben_data
